<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes API Client</h1>
      <p>Load, create and delete notes on a practice API.</p>
    </header>

    <main>
      <section>
        <h2>Your notes</h2>
        <button id="load-btn" type="button">Load notes</button>
        <p id="status"></p>
        <ul id="notes-list"></ul>
      </section>

      <section>
        <h2>Create a note</h2>
        <form id="note-form">
          <label for="title-input">Title (required, up to 100 characters)</label>
          <input id="title-input" type="text" />

          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" rows="4"></textarea>

          <button id="submit-btn" type="submit">Create note</button>
        </form>
      </section>
    </main>

    <footer>
      <p>QuickNotes System Design: Project 2</p>
    </footer>
  </body>
</html>
